<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>֎ XADON Operations</title><style>:root{color-scheme:dark;--mint:#69f6d0;--violet:#8f7cff;--ink:#f4f7ff;--muted:#9aa8c7}*{box-sizing:border-box}body{margin:0;background:#050816;color:var(--ink);font:14px Inter,system-ui,sans-serif;padding:28px;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 480px at 8% -8%,#69f6d01f,transparent 65%),radial-gradient(680px 520px at 98% 4%,#8f7cff22,transparent 65%)}.shell{position:relative;max-width:1220px;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}.brand{display:flex;align-items:center;gap:12px;font-weight:850;letter-spacing:.14em}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--mint),#6bb8ff 50%,var(--violet));color:#06151b;font-size:.7rem;box-shadow:0 0 0 7px #69f6d014}.eyebrow{color:var(--mint);font-size:.63rem;font-weight:800;letter-spacing:.18em;margin-bottom:8px}.topbar h1{font-size:2rem;letter-spacing:-.06em;margin:0}.status{display:flex;gap:8px;align-items:center;color:#92a3c4;font-size:.7rem}.status i{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 14px var(--mint)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:linear-gradient(145deg,#18234b9e,#0b122eb5);border:1px solid #c4d4ff22;border-radius:24px;padding:24px;box-shadow:0 24px 70px #0004,inset 0 1px 0 #fff1;backdrop-filter:blur(24px)}.card h2{font-size:1.1rem;margin:0 0 18px;letter-spacing:-.03em}.sub{color:var(--muted);font-size:.72rem;margin:-10px 0 18px}.entry{padding:13px 0;border-top:1px solid #c4d4ff12}.entry:first-child{border-top:0}.entry b{font-size:.82rem}.muted{color:var(--muted);font-size:.71rem;line-height:1.6}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:#69f6d012;color:var(--mint);font:800 .58rem/1 var(--font);letter-spacing:.08em;text-transform:uppercase;margin-right:7px}.pill:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}.empty{color:#7383a7;font-size:.8rem;padding:12px 0}@media(max-width:760px){body{padding:18px}.topbar{align-items:flex-start;gap:18px;flex-direction:column}.grid{grid-template-columns:1fr}}
</style></head><body><main class="shell"><header class="topbar"><div><div class="brand"><span class="mark">XA</span><span>XADON / OPERATIONS</span></div><div style="margin-top:25px"><div class="eyebrow">CONTROL PLANE</div><h1>Secure workspace overview</h1></div></div><div class="status"><i></i> Live monitoring enabled</div></header><section class="grid"><article class="card"><h2 id="userCount">Signed users</h2><p class="sub">Verified identities that have accessed the pairing workspace.</p><div id="users"></div></article><article class="card"><h2 id="sessionCount">Active sessions</h2><p class="sub">Short-lived pairing requests and their current state.</p><div id="sessions"></div></article></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const [u,s]=await Promise.all([fetch('/auth/admin/users'),fetch('/admin/sessions')]);const users=await u.json(),sessions=await s.json();userCount.textContent=`Signed users (${users.length})`;sessionCount.textContent=`Active sessions (${sessions.length})`;document.querySelector('#users').innerHTML=users.map(x=>`<div class="entry"><b>${esc(x.name)}</b><div class="muted">${esc(x.email)} · ${esc(x.provider)}<br>Last seen ${new Date(x.lastSeenAt).toLocaleString()}</div></div>`).join('')||'<div class="empty">No signed users yet.</div>';document.querySelector('#sessions').innerHTML=sessions.map(x=>`<div class="entry"><span class="pill">${esc(x.status)}</span><b>${esc(x.userEmail||'Unknown')}</b><div class="muted">Created ${new Date(x.createdAt).toLocaleString()} · expires ${new Date(x.expiresAt).toLocaleTimeString()}</div></div>`).join('')||'<div class="empty">No active sessions.</div>'}catch(e){}}load();setInterval(load,5000)</script></body></html>
